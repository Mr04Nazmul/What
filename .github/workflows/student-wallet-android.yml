name: Build Student Wallet Pro Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'student-wallet/index.html'
      - 'student-wallet-android/**'
      - '.github/workflows/student-wallet-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Prepare offline wallet assets
        run: |
          test -s student-wallet/index.html
          mkdir -p student-wallet-android/www
          cp student-wallet/index.html student-wallet-android/www/index.html
      - name: Install dependencies
        working-directory: student-wallet-android
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        working-directory: student-wallet-android
        run: npx cap add android
      - name: Build debug APK
        working-directory: student-wallet-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Wallet-Pro-debug-apk
          path: student-wallet-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
