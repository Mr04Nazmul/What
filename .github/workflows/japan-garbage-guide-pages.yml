name: Deploy Japan Garbage Guide to Pages
on:
  push:
    branches: [main]
    paths:
      - 'japan-garbage-guide/**'
      - '.github/workflows/japan-garbage-guide-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: japan-garbage-guide-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage the guide without changing other repository files
        run: |
          mkdir -p _site/japan-garbage-guide
          cp -R japan-garbage-guide/. _site/japan-garbage-guide/
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=./japan-garbage-guide/"><a href="./japan-garbage-guide/">Open Japan Garbage Guide</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - id: deployment
        uses: actions/deploy-pages@v4
