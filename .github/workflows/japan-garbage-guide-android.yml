name: Build Japan Garbage Guide Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'japan-garbage-guide/**'
      - '.github/workflows/japan-garbage-guide-android.yml'
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: japan-garbage-guide
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: japan-garbage-guide-debug-apk
          path: japan-garbage-guide/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
