name: Student Wallet Android Emulator Screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/student-wallet-emulator.yml'
      - 'student-wallet-android/**'
permissions:
  contents: read
jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare app
        run: |
          cp student-wallet/index.html student-wallet-android/www/index.html
          cd student-wallet-android
          npm install --no-audit --no-fund
          npx cap add android
          npm run ads:bundle
          node prepare-ads.cjs
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Run Android emulator and capture inside app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p emulator-screenshots
            adb install -r student-wallet-android/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.studentwallet.pro/.MainActivity
            sleep 30
            adb logcat -d -v time | grep -iE 'Wallet AdMob|admob|ads\.internal|Ads\.AppOpen|Ads\.Interstitial|Consent' | tail -250 > emulator-screenshots/admob-log.txt || true
            adb shell dumpsys activity activities | tail -100 > emulator-screenshots/activity.txt
            sleep 2
            adb shell screencap -p /sdcard/student-wallet-home.png
            adb pull /sdcard/student-wallet-home.png emulator-screenshots/student-wallet-home.png
            adb shell input tap 385 2200
            sleep 3
            adb shell screencap -p /sdcard/student-wallet-transactions.png
            adb pull /sdcard/student-wallet-transactions.png emulator-screenshots/student-wallet-transactions.png
            adb shell input tap 635 2200
            sleep 3
            adb shell screencap -p /sdcard/student-wallet-shifts.png
            adb pull /sdcard/student-wallet-shifts.png emulator-screenshots/student-wallet-shifts.png
            adb shell input tap 875 2200
            sleep 3
            adb shell screencap -p /sdcard/student-wallet-goals.png
            adb pull /sdcard/student-wallet-goals.png emulator-screenshots/student-wallet-goals.png
            adb logcat -d -t 5000 > emulator-screenshots/logcat.txt
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-wallet-emulator-screenshots
          path: emulator-screenshots/
          if-no-files-found: warn
