name: Student Wallet Play Release AAB
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/student-wallet-play-release.yml'
      - 'student-wallet/**'
      - 'student-wallet-android/**'
permissions:
  contents: read
jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAY_VERSION_CODE: '2'
      WALLET_RELEASE: '1'
      KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare offline web assets
        run: |
          test -s student-wallet/index.html
          mkdir -p student-wallet-android/www
          cp student-wallet/index.html student-wallet-android/www/index.html
      - name: Install and generate Android
        working-directory: student-wallet-android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npm run ads:bundle:release
          node prepare-ads.cjs
          npx cap sync android
          node prepare-release.cjs
      - name: Check release configuration
        working-directory: student-wallet-android
        run: |
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle
          grep 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          ! grep -q 'ca-app-pub-3940256099942544' android/app/src/main/AndroidManifest.xml
      - name: Build unsigned AAB for compile validation
        working-directory: student-wallet-android/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Upload unsigned AAB (NOT Play Store uploadable)
        uses: actions/upload-artifact@v4
        with:
          name: Student-Wallet-Pro-UNSIGNED-release-AAB
          path: student-wallet-android/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Build signed Play upload AAB when secrets exist
        if: ${{ env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        working-directory: student-wallet-android/android
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          ./gradlew bundleRelease --no-daemon --rerun-tasks \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload-key.jks" \
            "-Pandroid.injected.signing.store.password=$STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/student-wallet-signed.aab"
          rm -f "$RUNNER_TEMP/upload-key.jks"
      - name: Upload signed AAB
        if: ${{ env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Student-Wallet-Pro-SIGNED-Play-AAB
          path: ${{ runner.temp }}/student-wallet-signed.aab
          if-no-files-found: error
      - name: Upload signed AAB to Google Play internal testing (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.studentwallet.pro
          releaseFiles: ${{ runner.temp }}/student-wallet-signed.aab
          track: internal
          status: draft
